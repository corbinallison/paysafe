[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-paysafe"
version = "0.1.0"
description = "PaySafe payment security for the NVIDIA NeMo Agent Toolkit: scan x402 payments before settling, with prompt-injection provenance and signed verdicts. Registers scan / reputation / report functions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PaySafe", email = "contact@paysafe-agent.com" }]
keywords = ["nemo-agent-toolkit", "nvidia", "nat", "x402", "payments", "security", "ai-agents", "prompt-injection", "usdc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["paysafe-x402>=0.3.0", "nvidia-nat>=1.1"]

# NeMo Agent Toolkit discovers plugins through this entry-point group. The
# value is the module the toolkit imports on init; importing it runs the
# @register_function decorators.
[project.entry-points."nat.plugins"]
nemo_paysafe = "nemo_paysafe.register"

[project.urls]
Homepage = "https://paysafe-agent.com"
Repository = "https://github.com/corbinallison/paysafe"
Documentation = "https://github.com/corbinallison/paysafe/tree/main/integrations/nemo-paysafe"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_paysafe"]
