[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollwarden"
# Version is single-sourced from src/tollwarden/__init__.py (__version__) —
# bump it there only; hatchling reads it at build time (see [tool.hatch.version]).
dynamic = ["version"]
description = "Official Python SDK for TollWarden — the payment security firewall for x402 micropayments. Scan payments before settlement, auto-tag provenance for prompt-injection detection, verify Ed25519 verdict attestations, subscribe to plans autonomously."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [{ name = "TollWarden", email = "contact@tollwarden.com" }]
keywords = ["x402", "payments", "security", "firewall", "ai-agents", "prompt-injection", "usdc", "base", "micropayments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://tollwarden.com"
Repository = "https://github.com/tollwarden/tollwarden"
Documentation = "https://github.com/tollwarden/tollwarden/tree/main/sdk-python"

[tool.hatch.version]
path = "src/tollwarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tollwarden"]
